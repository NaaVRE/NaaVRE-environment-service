name: Lint

on:
  workflow_call:
    inputs:
      runs-on:
        default: ubuntu-latest
        type: string

jobs:
  lint:
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install the project
        run: uv sync --locked --dev

      - name: Run flake8
        run: |
          uv run flake8 app/
