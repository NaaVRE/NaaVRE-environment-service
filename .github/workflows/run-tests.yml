name: Run tests

on:
  workflow_call:
    inputs:
      runs-on:
        default: ubuntu-latest
        type: string

jobs:
  test-minikube-script:
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: | 
          pip install -r requirements.txt

      - name: Run pytest
        shell: bash -l {0}
        run: |
          pip install pytest
          pytest ${{ inputs.test }} --log-cli-level=DEBUG -vv --tb=long
