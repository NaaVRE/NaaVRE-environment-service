# yaml
name: Run tests

on:
  workflow_call:
    inputs:
      runs-on:
        default: ubuntu-latest
        type: string
      debug:
        required: true
        type: string
      verify_ssl:
        required: true
        type: string
      disable_auth:
        required: true
        type: string
      test:
        required: true
        type: string

env:
  DEBUG: ${{ inputs.debug }}
  DISABLE_AUTH: ${{ inputs.disable_auth }}
  VERIFY_SSL: ${{ inputs.verify_ssl }}
  REGISTRY_TOKEN_FOR_TESTS: ${{ secrets.registry_token_for_tests }}
  CELL_GITHUB_TOKEN: ${{ secrets.cell_github_token }}

jobs:
  test-minikube-script:
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: true
      matrix:
        chart:
          - minikube_tests/charts/argo-workflows-0.33.1-Chart.yaml
    steps:
      - uses: actions/checkout@v6

      - name: Install pytest
        run: | 
          pip install -r requirements.txt
          pip install pytest

      - name: pytest
        shell: bash -l {0}
        run: |
          pip install pytest
          pytest ${{ inputs.test }} -s --ignore=docker --ignore=cypress --no-header --log-cli-level=DEBUG -vv --tb=long
