apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "naavre-environment-service.fullname" . }}
  labels:
    {{- include "naavre-environment-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "naavre-environment-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        rollme: {{ randAlphaNum 5 | quote }}
      labels:
        {{- include "naavre-environment-service.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "naavre-environment-service.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ROOT_PATH
              value: "{{ .Values.conf.rootPath }}"
            - name: CONFIG_FILE_PATH
              value: "/configuration.json"
            - name: IMAGE_PULLER_NAMESPACE
              value: "{{ .Release.Namespace }}"
            - name: IMAGE_PULLER_NAME
              value: "{{ include "naavre-environment-service.fullname" . }}-image-puller"
            - name: IMAGE_PULL_SECRETS
              value: {{ .Values.imagePullSecrets | toJson | quote }}
            - name: IMAGE_PULLER_MATCH_NODE_PURPOSE
              value: {{ .Values.image_puller_cron.nodeAffinity.matchNodePurpose | default "prefer" | quote }}
            {{- range $k, $v := .Values.env}}
            - name: {{$k | quote}}
              value: {{$v | quote}}
            {{- end}}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /configuration.json
              subPath: configuration.json
            {{- with .Values.volumeMounts}}
            {{- toYaml . | nindent 12}}
            {{- end}}
      volumes:
        - name: config-volume
          configMap:
            name: {{include "naavre-environment-service.fullname" .}}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
